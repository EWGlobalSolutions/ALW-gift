<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For A.L.W.</title>
    <style>
        body {
            /* The Emerald Green & Gold Background Image */
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #050A1F; /* Fallback color */
            
            color: #FDFBF7; /* Cream text */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        /* The Opening Message Screen */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Semi-transparent overlay so the background image shows through */
            background-color: rgba(5, 10, 31, 0.75); 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        #splash-screen h2 {
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); /* Helps text pop against the background */
        }

        #splash-screen img {
            max-width: 250px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); 
        }

        .enter-button {
            padding: 12px 30px;
            background-color: #D4AF37; /* Gold button */
            color: #050A1F;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .enter-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }

        /* The Media Player (Hidden initially) */
        #media-container {
            display: none; 
            width: 90%;
            max-width: 600px;
            padding: 20px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            /* A slightly transparent deep blue box for the media player */
            background: linear-gradient(145deg, rgba(10, 25, 49, 0.9), rgba(21, 42, 74, 0.9));
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            text-align: center;
            z-index: 5;
        }

        audio {
            width: 100%;
            outline: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Opening Screen -->
    <div id="splash-screen">
        <h2>Happy Birthday, Beautiful.</h2>
        <img src="6a9dfc26dc014b99f6feb1e3-1788739079236-1.gif" alt="A gift for you">
        <button class="enter-button" onclick="revealGift()">Open Your Gift</button>
    </div>

    <!-- Media Player -->
    <div id="media-container">
        <audio id="player" controls>
            <source src="EWProductions - Happy_Birthday_Beautiful - 1788725011365.m4a" type="audio/mp4">
            Your browser does not support the audio element.
        </audio>
    </div>

    <script>
        function revealGift() {
            const splash = document.getElementById('splash-screen');
            const container = document.getElementById('media-container');
            const player = document.getElementById('player');

            // Fade out the splash screen
            splash.style.opacity = '0';
            
            // Wait for the fade to finish, then swap visibility
            setTimeout(() => {
                splash.style.display = 'none';
                container.style.display = 'block';
                
                // Automatically start playing the track
                player.play(); 
            }, 800);
        }
    </script>
</body>
</html>
