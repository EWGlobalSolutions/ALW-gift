<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For A.L.W.</title>
    <style>
        body {
            background-color: #050A1F; /* Deep blue background */
            color: #FDFBF7; /* Cream text */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        /* The Opening Message Screen */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050A1F;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        #splash-screen h2 {
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        #splash-screen img {
            max-width: 250px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); /* Subtle gold glow */
        }

        .enter-button {
            padding: 12px 30px;
            background-color: #D4AF37; /* Gold button */
            color: #050A1F;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .enter-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }

        /* The Media Player (Hidden initially) */
        #media-container {
            display: none; 
            width: 90%;
            max-width: 600px;
            padding: 20px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            background: linear-gradient(145deg, #0A1931, #152A4A);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        audio, video {
            width: 100%;
            outline: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Opening Screen -->
    <div id="splash-screen">
        <h2>Happy Birthday, Beautiful.</h2>
        <img src="6a9dfc26dc014b99f6feb1e3-1788739079236-1.gif" alt="A gift for you">
        <button class="enter-button" onclick="revealGift()">Open Your Gift</button>
    </div>

    <!-- Media Player -->
    <div id="media-container">
        <video id="player" controls>
            <source src="lyric-video.mp4" type="audio/mp4">
            </video>
    </div>

    <script>
        function revealGift() {
            const splash = document.getElementById('splash-screen');
            const container = document.getElementById('media-container');
            const player = document.getElementById('player');

            // 1. Fade out the splash screen
            splash.style.opacity = '0';
            
            // 2. Wait for the fade to finish (0.8 seconds), then swap what is visible
            setTimeout(() => {
                splash.style.display = '719405797_1788728978046837.jpg';
                container.style.display = 'block';
                
                // 3. Automatically start playing the track
                player.play(); 
            }, 800);
        }
    </script>
</body>
</html>
