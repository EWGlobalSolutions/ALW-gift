<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For A.L.W.</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #050A1F;
            color: #FDFBF7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            inset: 0;
            background-color: rgba(5, 10, 31, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
            text-align: center;
            padding: 20px;
        }

        #splash-screen h2 {
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #splash-screen img {
            max-width: 250px;
            width: 100%;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .enter-button {
            padding: 12px 30px;
            background-color: #D4AF37;
            color: #050A1F;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .enter-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }

        /* Video Container */
        #media-container {
            display: none;
            width: 100%;
            max-width: 800px;
            padding: 12px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 12px;
            background: linear-gradient(145deg, rgba(10, 25, 49, 0.95), rgba(21, 42, 74, 0.95));
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            z-index: 5;
        }

        video {
            width: 100%;
            max-height: 75vh;
            display: block;
            border-radius: 8px;
            background-color: #000;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h2>Happy Birthday, Beautiful.</h2>
        <img src="6a9dfc26dc014b99f6feb1e3-1788739079236-1.gif" alt="A gift for you">
        <button class="enter-button" onclick="revealGift()">Open Your Gift</button>
    </div>

    <div id="media-container">
        <video id="player" controls playsinline preload="auto">
            <source src="lyric-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        function revealGift() {
            const splash = document.getElementById('splash-screen');
            const container = document.getElementById('media-container');
            const player = document.getElementById('player');

            splash.style.opacity = '0';

            setTimeout(() => {
                splash.style.display = 'none';
                container.style.display = 'block';
                player.play().catch(err => {
                    console.log("Autoplay prevented; user can press play manually.", err);
                });
            }, 800);
        }
    </script>
</body>
</html>
